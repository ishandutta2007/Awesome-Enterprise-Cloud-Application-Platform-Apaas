<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for soft neon bloom -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.2; stroke-dashoffset: 0; }
        50% { opacity: 0.6; stroke-dashoffset: -30; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbMove {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(40px, -20px) scale(1.1); }
      }
      .floating-layer {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .animated-circuit {
        stroke-dasharray: 8 12;
        animation: pulseBeam 4s linear infinite;
      }
      .glowing-orb {
        animation: orbMove 10s ease-in-out infinite;
      }
      .tech-badge {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glowing Orbs (Deep Background) -->
  <g class="glowing-orb" opacity="0.4">
    <circle cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.18" />
    <circle cx="1020" cy="320" r="170" fill="#8b5cf6" filter="url(#glow)" opacity="0.2" />
    <circle cx="850" cy="80" r="100" fill="#ec4899" filter="url(#glow)" opacity="0.12" />
  </g>

  <!-- High-Tech Circuit & Grid Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="280" y1="0" x2="280" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="370" x2="1200" y2="370" />
  </g>

  <!-- Animated Cyber Connective Pipelines -->
  <g fill="none">
    <path class="animated-circuit" d="M 120 340 L 320 340 L 380 390 L 800 390" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-circuit" d="M 400 40 L 750 40 L 820 90 L 1100 90" stroke="#818cf8" stroke-width="2" />
    <path class="animated-circuit" d="M 980 200 L 1050 200 L 1120 270 L 1180 270" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Decorative Circuit Nodes -->
  <circle cx="120" cy="340" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="380" cy="390" r="4" fill="#38bdf8" />
  <circle cx="800" cy="390" r="4" fill="#818cf8" />
  <circle cx="750" cy="40" r="4" fill="#818cf8" />
  <circle cx="1100" cy="90" r="4" fill="#c084fc" />

  <!-- Outer Border Stroke -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Foreground Content (Always on top, fully crisp & readable) -->
  <g class="floating-layer">
    <!-- Supertag Pill -->
    <g transform="translate(60, 52)">
      <rect width="365" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#38bdf8" letter-spacing="1">
        ENTERPRISE aPaaS &amp; LOW-CODE PLATFORMS
      </text>
    </g>

    <!-- Main Title -->
    <text x="60" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="url(#primaryGrad)" letter-spacing="-1">
      Awesome Enterprise aPaaS
    </text>

    <!-- Subtitle / Tagline -->
    <text x="60" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="20" fill="#cbd5e1" letter-spacing="0.2">
      Curated Landscape of Enterprise Cloud Application Platforms &amp; Self-Hosted Open-Source Frameworks
    </text>

    <!-- Narrative bullet / highlight -->
    <text x="60" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">
      Empowering modern business technologists, DevOps, and developers with rapid visual application builders &amp; internal tool engines.
    </text>

    <!-- Interactive / Feature Pills Group -->
    <g transform="translate(60, 275)">
      <!-- Pill 1: Enterprise Low-Code -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
        <text x="18" y="26" class="tech-badge" fill="#e2e8f0">⚡ Low-Code / No-Code</text>
      </g>

      <!-- Pill 2: Open Source Sovereignty -->
      <g transform="translate(195, 0)">
        <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
        <text x="18" y="26" class="tech-badge" fill="#e2e8f0">🛡️ Self-Hosted Sovereignty</text>
      </g>

      <!-- Pill 3: Visual Data Modeling -->
      <g transform="translate(395, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
        <text x="18" y="26" class="tech-badge" fill="#e2e8f0">📊 Visual Data Modeling</text>
      </g>

      <!-- Pill 4: Internal Tool Builders -->
      <g transform="translate(590, 0)">
        <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
        <text x="18" y="26" class="tech-badge" fill="#e2e8f0">🛠️ Internal Tool Engines</text>
      </g>

      <!-- Pill 5: AI-Augmented Apps -->
      <g transform="translate(790, 0)">
        <rect width="170" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
        <text x="18" y="26" class="tech-badge" fill="#e2e8f0">🤖 AI-Native Copilots</text>
      </g>
    </g>

    <!-- Footer Stats / Status Sub-bar -->
    <g transform="translate(60, 355)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
        ⭐ Community Curated &nbsp;•&nbsp; 🚀 15+ Production-Grade Solutions &nbsp;•&nbsp; 🔄 Continually Maintained &nbsp;•&nbsp; 🌐 Free &amp; Open Source First
      </text>
    </g>
  </g>
</svg>